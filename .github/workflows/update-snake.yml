name: Update contribution snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

# Grant write permission so the workflow can push generated files back to the repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with write credentials)
        uses: actions/checkout@v4
        with:
          # persist-credentials is true by default in v4, but make explicit to avoid mistakes
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install generator
        run: npm install -g github-contribution-grid-snake
      - name: Generate snake SVG
        run: |
          mkdir -p output
          github-contribution-grid-snake --user=atharvahatekar --output=output/github-contribution-grid-snake.svg
      - name: Commit and push to branch (only if changes)
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add output/github-contribution-grid-snake.svg
          if ! git diff --cached --quiet; then
            # push into the workflow branch so it doesn't try to push directly to protected main
            BRANCH_NAME="${GITHUB_REF##*/}"
            # If workflow was manually dispatched, GITHUB_REF may be refs/heads/<branch>; fallback:
            if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" = "refs" ]; then
              BRANCH_NAME="add-snake-action"
            fi
            git commit -m "chore: update contribution snake"
            git push origin HEAD:$BRANCH_NAME
          else
            echo "No changes to commit"
          fi
